name: Gerar APK Profchana

on:
  workflow_dispatch:
  push:
    paths:
      - "profchana-cloud-build-v1.0-2.zip"
      - ".github/workflows/build-apk.yml"


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Extrair projeto ZIP
        run: |
          mkdir projeto
          unzip -q "profchana-cloud-build-v1.0-2.zip" -d projeto


      - name: Encontrar Android
        run: |

          GRADLE=$(find projeto -name gradlew | head -1)

          if [ -z "$GRADLE" ]; then
            echo "Gradlew não encontrado"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV



      - name: Corrigir JVM Kotlin
        working-directory: ${{ env.ANDROID_DIR }}
        run: |

          echo "Corrigindo app/build.gradle.kts"

          cat >> app/build.gradle.kts <<'EOF'


android {

    compileOptions {

        sourceCompatibility = JavaVersion.VERSION_17

        targetCompatibility = JavaVersion.VERSION_17

    }

}


kotlin {

    jvmToolchain(17)

}

EOF



      - name: Dar permissão Gradle
        run: |
          chmod +x "$ANDROID_DIR/gradlew"



      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"



      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4



      - name: Gerar APK Debug
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace



      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: profchana-apk-teste

          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
